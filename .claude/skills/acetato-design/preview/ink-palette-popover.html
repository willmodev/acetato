<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="toolbar.css">
<style>
  .popover {
    display: inline-flex; padding: var(--s-3);
    background: var(--chrome-glass-strong);
    border: 1px solid var(--stroke-1);
    border-radius: var(--r-popover);
    box-shadow: var(--shadow-pop);
  }
  .stage { justify-content: center; flex-direction: column; gap: var(--s-4); }
  .ink { width: var(--swatch); height: var(--swatch); margin: var(--s-1); padding: 3px;
         border: 2px solid transparent; border-radius: var(--r-swatch); display: block; }
  .ink i { display: block; width: 100%; height: 100%; border-radius: var(--r-tight); }
  .ink--round, .ink--round i { border-radius: var(--r-pill); }
  .ink--sel { border-color: var(--accent-ring); }
</style>
</head>
<body>
<div class="stage backdrop-split">
  <div class="popover"><span class="ink ink--sel"><i style="background:var(--ink-red)"></i></span><span class="ink"><i style="background:var(--ink-blue)"></i></span><span class="ink"><i style="background:var(--ink-yellow)"></i></span><span class="ink"><i style="background:var(--ink-green)"></i></span><span class="ink"><i style="background:var(--ink-white)"></i></span><span class="ink"><i style="background:var(--ink-black)"></i></span><span class="ink ink--round"><i style="background:var(--ink-grad-sample)"></i></span></div>
  <div class="popover"><span class="ink"><i style="background:var(--ink-red)"></i></span><span class="ink"><i style="background:var(--ink-blue)"></i></span><span class="ink"><i style="background:var(--ink-yellow)"></i></span><span class="ink"><i style="background:var(--ink-green)"></i></span><span class="ink"><i style="background:var(--ink-white)"></i></span><span class="ink"><i style="background:var(--ink-black)"></i></span><span class="ink ink--round ink--sel"><i style="background:var(--ink-grad-sample)"></i></span></div>
</div>
</body>
</html>
