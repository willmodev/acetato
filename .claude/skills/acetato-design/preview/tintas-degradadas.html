<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
  /* Tintas degradadas (HU-27): cada tinta sólida → su vecino fijo. */
  .stage { display: grid; grid-template-columns: repeat(3, 120px); gap: 14px; justify-content: center; align-content: center; }
  .sw { width: 120px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .chip { width: 100%; height: 40px; border-radius: 12px; }
  .chip--white { box-shadow: inset 0 0 0 1px rgba(0,0,0,0.14); }
  .chip--black { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }
  .meta { text-align: center; }
  .meta .n { font-size: 11px; font-weight: 600; color: var(--fg-1); }
  .meta .v { font-size: 10px; color: var(--fg-3); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="stage">
  <div class="sw"><div class="chip" style="background:linear-gradient(90deg,var(--ink-red),var(--ink-red-end))"></div><div class="meta"><div class="n">rojo → rosa</div><div class="v">#FF3B30 → #FF2D92</div></div></div>
  <div class="sw"><div class="chip" style="background:linear-gradient(90deg,var(--ink-blue),var(--ink-blue-end))"></div><div class="meta"><div class="n">azul → índigo</div><div class="v">#0A84FF → #5E5CE6</div></div></div>
  <div class="sw"><div class="chip" style="background:linear-gradient(90deg,var(--ink-yellow),var(--ink-yellow-end))"></div><div class="meta"><div class="n">amarillo → naranja</div><div class="v">#FFD60A → #FF9F0A</div></div></div>
  <div class="sw"><div class="chip" style="background:linear-gradient(90deg,var(--ink-green),var(--ink-green-end))"></div><div class="meta"><div class="n">verde → lima</div><div class="v">#30D158 → #A3E635</div></div></div>
  <div class="sw"><div class="chip chip--white" style="background:linear-gradient(90deg,var(--ink-white),var(--ink-white-end))"></div><div class="meta"><div class="n">blanco → gris</div><div class="v">#FFFFFF → #AEAEB2</div></div></div>
  <div class="sw"><div class="chip chip--black" style="background:linear-gradient(90deg,var(--ink-black),var(--ink-black-end))"></div><div class="meta"><div class="n">negro → gris</div><div class="v">#0A0A0A → #636366</div></div></div>
</div>
</body>
</html>
