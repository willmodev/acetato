<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="toolbar.css">
<style>
  .stage { justify-content: center; }
  .scene { position: relative; width: 80%; min-height: 160px; }
  .committed { position: absolute; left: 8%; top: 10%; font-weight: 600; font-size: var(--annot-3); color: var(--ink-red); font-family: var(--font-ui); line-height: 1.2; }
  .draft { position: absolute; left: 8%; top: 58%; font-family: var(--font-ui); font-weight: 600; font-size: var(--annot-3); line-height: 1.2; color: var(--fg-3); }
  .caret { display: inline-block; width: 2px; height: var(--annot-3); background: var(--ink-blue); vertical-align: -5px; margin-right: 2px; }
</style>
</head>
<body>
<div class="stage backdrop-split">
  <div class="scene">
    <div class="committed">Punto clave</div>
    <div class="draft"><span class="caret"></span>Texto</div>
  </div>
</div>
</body>
</html>
