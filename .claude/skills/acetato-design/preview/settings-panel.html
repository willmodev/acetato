<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="toolbar.css">
<style>
  .stage { justify-content: center; }
  .win { width: var(--settings-w); max-width: 100%; background: var(--chrome-solid); border: 1px solid var(--stroke-1); color: var(--fg-1); }
  .head { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 var(--s-5); font-size: 12px; font-weight: 600; }
  .hr { height: 1px; background: var(--stroke-2); }
  .body { padding: 4px var(--s-5) var(--s-4); }
  .blk { font-size: 11px; font-weight: 600; color: var(--fg-2); margin: 14px 0 4px; }
  .row { display: grid; grid-template-columns: 1fr auto 30px 30px; align-items: center; min-height: 30px; }
  .lbl { font-size: 12px; }
  .cap-key { min-width: 132px; padding: 4px var(--s-2); text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);
             background: var(--chrome-solid-2); border: 1px solid var(--stroke-1); border-radius: var(--r-swatch); }
  .cap-key--capturing { background: var(--accent-fill); border-color: var(--accent-ring); color: var(--accent); }
  .ib { width: var(--btn-row); height: var(--btn-row); justify-self: end; display: grid; place-items: center; color: var(--fg-2); border-radius: var(--r-button); }
  .ib svg { width: 14px; height: 14px; stroke-width: 2; }
  .msg { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; color: var(--danger); }
  .tb { font-weight: 400; font-size: 11px; color: var(--fg-1); padding: 3px var(--s-2); margin-left: 6px; border-radius: var(--r-swatch); }
  .foot { height: 48px; display: flex; align-items: center; justify-content: flex-end; padding: 0 14px 0 var(--s-5); }
</style>
</head>
<body>
<div class="stage">
  <div class="win" role="dialog" aria-label="Ajustes">
    <div class="head"><span>Ajustes</span><button class="tool" title="Cerrar"><i data-lucide="x"></i></button></div>
    <div class="hr"></div>
    <div class="body">
      <div class="blk">Siempre activos</div>
      <div class="row"><span class="lbl">Mostrar/ocultar</span><span class="cap-key">Ctrl+Alt+D</span><span></span><span class="ib" title="Quitar"><i data-lucide="x"></i></span></div>
      <div class="row"><span class="lbl">Modo dibujo</span><span class="cap-key">Ctrl+Alt+E</span><span></span><span class="ib" title="Quitar"><i data-lucide="x"></i></span></div>
      <div class="blk">Solo al dibujar</div>
      <div class="row"><span class="lbl">Tinta roja</span><span class="cap-key">Ctrl+1</span><span></span><span class="ib" title="Quitar"><i data-lucide="x"></i></span></div>
      <div class="row"><span class="lbl">Lápiz</span><span class="cap-key cap-key--capturing">Pulsa la combinación…</span><span></span><span class="ib" title="Quitar"><i data-lucide="x"></i></span></div>
      <div class="row"><span class="lbl">Flecha</span><span class="cap-key">Ctrl+P</span><span class="ib" title="Restaurar"><i data-lucide="rotate-ccw"></i></span><span class="ib" title="Quitar"><i data-lucide="x"></i></span><div class="msg"><span>Ya la usa Lápiz</span><span><b class="tb">Reemplazar</b><b class="tb">Cancelar</b></span></div></div>
      <div class="row"><span class="lbl">Recortar</span><span class="cap-key">Ctrl+S</span><span></span><span class="ib" title="Quitar"><i data-lucide="x"></i></span><div class="msg"><span>No disponible</span></div></div>
      <div class="row"><span class="lbl">Siguiente herramienta</span><span class="cap-key">Sin atajo</span><span class="ib" title="Restaurar"><i data-lucide="rotate-ccw"></i></span><span></span></div>
    </div>
    <div class="hr"></div>
    <div class="foot"><b class="tb">Restaurar todo</b></div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
