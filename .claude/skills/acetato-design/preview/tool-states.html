<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="toolbar.css">
<style>
  .stage { justify-content: center; gap: var(--s-6); }
  .case { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .case .bar { padding: var(--bar-pad); }
  .case-label { font-size: 11px; font-weight: 500; color: var(--fg-2); letter-spacing: .02em; }
  /* force the hover visual statically for the specimen */
  .is-hover { background: var(--hover); color: var(--fg-1); }
  /* Pizarra (HU-35): the sheet fill says the state; the button never takes the accent. */
  .wb { width: var(--icon); height: var(--icon); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .wb-white { fill: var(--board-white); stroke: none; }
  .wb-black { fill: var(--board-black); stroke: none; }
  .stage { flex-wrap: wrap; }
</style>
</head>
<body>
<div class="stage">
  <div class="case">
    <div class="bar"><button class="tool"><i data-lucide="pencil"></i></button></div>
    <span class="case-label">Reposo</span>
  </div>
  <div class="case">
    <div class="bar"><button class="tool is-hover"><i data-lucide="pencil"></i></button></div>
    <span class="case-label">Hover</span>
  </div>
  <div class="case">
    <div class="bar"><button class="tool tool--active"><i data-lucide="pencil"></i></button></div>
    <span class="case-label">Activa</span>
  </div>
  <div class="case">
    <div class="bar"><button class="tool" disabled><i data-lucide="mouse-pointer-2"></i></button></div>
    <span class="case-label">Deshabilitada</span>
  </div>
  <div class="case">
    <div class="bar"><button class="tool"><svg class="wb" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h20 M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3 M7 21l5-5 5 5"/></svg></button></div>
    <span class="case-label" style="white-space:nowrap">Pizarra · apagada</span>
  </div>
  <div class="case">
    <div class="bar"><button class="tool"><svg class="wb" viewBox="0 0 24 24" aria-hidden="true"><path class="wb-white" d="M3 3h18v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M2 3h20 M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3 M7 21l5-5 5 5"/></svg></button></div>
    <span class="case-label" style="white-space:nowrap">Pizarra · blanca</span>
  </div>
  <div class="case">
    <div class="bar"><button class="tool"><svg class="wb" viewBox="0 0 24 24" aria-hidden="true"><path class="wb-black" d="M3 3h18v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M2 3h20 M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3 M7 21l5-5 5 5"/></svg></button></div>
    <span class="case-label" style="white-space:nowrap">Pizarra · negra</span>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
