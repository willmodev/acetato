<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="toolbar.css">
<style>
  .popover {
    display: inline-flex; padding: var(--s-3);
    background: var(--chrome-glass-strong);
    border: 1px solid var(--stroke-1);
    border-radius: var(--r-popover);
    box-shadow: var(--shadow-pop);
  }
  .stage { justify-content: center; }
  .cell { width: var(--btn); height: var(--btn); display: grid; place-items: center; border-radius: var(--r-button); }
  .cell i { display: block; border-radius: 50%; background: var(--fg-2); }
  .cell--hover { background: var(--hover); }
  .cell--sel { background: var(--accent-fill); }
  .cell--sel i { background: var(--accent); }
</style>
</head>
<body>
<div class="stage backdrop-split">
  <div class="popover"><span class="cell cell--sel"><i style="width:6px;height:6px"></i></span><span class="cell"><i style="width:10px;height:10px"></i></span><span class="cell cell--hover"><i style="width:14px;height:14px"></i></span><span class="cell"><i style="width:18px;height:18px"></i></span><span class="cell"><i style="width:22px;height:22px"></i></span></div>
</div>
</body>
</html>
